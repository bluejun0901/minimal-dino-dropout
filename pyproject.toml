[project]
name = "minimal-dino"
version = "0.1.0"
description = "A minimal DINO plus dropout baseline for sentence embeddings"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "datasets>=2.19",
    "hydra-core>=1.3,<2",
    "matplotlib>=3.8",
    "scipy>=1.10",
    "torch==2.5.1",
    "transformers>=4.40,<6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
minimal-dino-train = "minimal_dino.train:main"
minimal-dino-eval = "minimal_dino.evaluation:main"
minimal-dino-plot = "minimal_dino.plot_metrics:main"

[[tool.uv.index]]
url = "https://download.pytorch.org/whl/cu121"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/minimal_dino"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
