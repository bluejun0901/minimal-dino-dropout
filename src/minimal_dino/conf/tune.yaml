defaults:
  - data: default
  - model: bert_base
  - augmentation: dropout
  - objective: byol
  - optimization: default
  - teacher: default
  - evaluation: stsb
  - checkpoint: default
  - runtime: default
  - logging: default
  - _self_

tuning:
  study_name: minimal-dino-first
  storage: sqlite:///runs/optuna/optuna.db
  n_trials: 150
  timeout: null
  metric: sts_spearman
  sampler_seed: 42
  pruner_startup_trials: 10
  pruner_warmup_steps: 1500

hydra:
  run:
    dir: ${runtime.output_dir}
  job:
    chdir: false
  output_subdir: .hydra
