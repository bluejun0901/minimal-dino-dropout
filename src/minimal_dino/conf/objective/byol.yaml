name: byol
center_momentum: 0.96
center_scale: 0.0
# Null start falls back to center_scale; null end keeps the start value constant.
center_scale_start: null
center_scale_end: null
# Optional embedding regularizer; mode is normalized_mean, decoupled, koleo, or covariance.
# A weight of 0 disables it; uniformity_t is used by the first two modes only.
uniformity_weight: 0.0
uniformity_t: 2.0
uniformity_mode: normalized_mean
